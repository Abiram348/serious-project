apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: swarmdev-dev

namePrefix: dev-

resources:
  - ../../base
  - ../../base/postgres/statefulset.yaml
  - ../../base/postgres/service.yaml
  - ../../base/redis/deployment.yaml
  - ../../base/redis/service.yaml
  - ../../base/redis/pvc.yaml
  - ../../base/qdrant/statefulset.yaml
  - ../../base/qdrant/service.yaml
  - ../../base/qdrant/pdb.yaml

commonLabels:
  app.kubernetes.io/env: dev

replicas:
  - name: web
    count: 1
  - name: api
    count: 1
  - name: orchestrator
    count: 1

patches:
  - target:
      kind: Ingress
      name: swarmdev
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: dev.swarmdev.io
      - op: replace
        path: /spec/rules/1/host
        value: dev-api.swarmdev.io
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1scheme
        value: internet-facing
  - target:
      kind: Ingress
      name: swarmdev-internal
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: dev-orchestrator.swarmdev.internal
