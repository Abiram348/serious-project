apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: swarmdev-staging

namePrefix: staging-

resources:
  - ../../base
  # Staging uses AWS RDS (created by Terraform) — no in-cluster postgres
  - ../../base/redis
  - ../../base/qdrant

commonLabels:
  app.kubernetes.io/env: staging

replicas:
  - name: web
    count: 2
  - name: api
    count: 2
  - name: orchestrator
    count: 1

images:
  - name: swarmdev-web
    newName: 920373016840.dkr.ecr.us-east-1.amazonaws.com/swarmdev/web
    newTag: latest
  - name: swarmdev-api
    newName: 920373016840.dkr.ecr.us-east-1.amazonaws.com/swarmdev/api
    newTag: latest
  - name: swarmdev-orchestrator
    newName: 920373016840.dkr.ecr.us-east-1.amazonaws.com/swarmdev/orchestrator
    newTag: latest

patches:
  - target:
      kind: ConfigMap
      name: swarmdev-config
    patch: |
      - op: replace
        path: /data/NODE_ENV
        value: "staging"
      - op: replace
        path: /data/NEXT_PUBLIC_SOCKET_URL
        value: "http://staging-api.swarmdev.io"
      - op: replace
        path: /data/NEXT_PUBLIC_API_URL
        value: "http://staging-api.swarmdev.io"
      - op: replace
        path: /data/ORCHESTRATOR_URL
        value: "http://staging-orchestrator:8000"
  - target:
      kind: Ingress
      name: swarmdev
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging.swarmdev.io
      - op: replace
        path: /spec/rules/1/host
        value: staging-api.swarmdev.io
      # Staging uses HTTP-only ALB (no ACM cert)
      - op: remove
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
      - op: remove
        path: /metadata/annotations/alb.ingress.kubernetes.io~1ssl-redirect
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1listen-ports
        value: '[{"HTTP": 80}]'
  - target:
      kind: Ingress
      name: swarmdev-internal
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging-orchestrator.swarmdev.internal
  # Reduce resource limits for staging cost control
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
  - target:
      kind: Deployment
      name: orchestrator
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
