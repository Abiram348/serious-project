apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swarmdev-ingress
  namespace: swarmdev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - swarmdev.example.com
      secretName: swarmdev-tls
  rules:
    - host: swarmdev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 3001
          - path: /orchestrator
            pathType: Prefix
            backend:
              service:
                name: orchestrator-service
                port:
                  number: 8000
