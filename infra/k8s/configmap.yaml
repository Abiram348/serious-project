apiVersion: v1
kind: ConfigMap
metadata:
  name: swarmdev-config
  namespace: swarmdev
data:
  NODE_ENV: "production"
  API_PORT: "3001"
  ORCHESTRATOR_PORT: "8000"
  FRONTEND_PORT: "3000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "swarmdev"
  QDRANT_HOST: "qdrant-service"
  QDRANT_PORT: "6333"
