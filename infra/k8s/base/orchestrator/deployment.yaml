apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: swarmdev
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: swarmdev
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
        app.kubernetes.io/component: orchestration
        app.kubernetes.io/part-of: swarmdev
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: swarmdev
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: swarmdev-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: swarmdev-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: swarmdev-config
                  key: REDIS_URL
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: swarmdev-config
                  key: QDRANT_URL
            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: swarmdev-secrets
                  key: ORCHESTRATOR_SECRET
            - name: OLLAMA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: swarmdev-secrets
                  key: OLLAMA_BASE_URL
                  optional: true
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: swarmdev-config
                  key: OLLAMA_MODEL
                  optional: true
            - name: E2B_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swarmdev-secrets
                  key: E2B_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orchestrator
      terminationGracePeriodSeconds: 60
