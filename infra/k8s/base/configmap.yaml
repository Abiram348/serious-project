apiVersion: v1
kind: ConfigMap
metadata:
  name: swarmdev-config
  namespace: swarmdev
data:
  # Shared non-sensitive configuration
  NODE_ENV: "production"
  PORT: "3000"
  API_PORT: "3001"
  ORCHESTRATOR_PORT: "8000"
  NEXT_PUBLIC_SOCKET_URL: "https://api.swarmdev.io"
  NEXT_PUBLIC_API_URL: "https://api.swarmdev.io"
  ORCHESTRATOR_URL: "http://orchestrator:8000"
  QDRANT_URL: "http://qdrant:6333"
  REDIS_URL: "redis://redis:6379"
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
