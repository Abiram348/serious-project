apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: swarmdev

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres.yaml
  - redis.yaml
  - qdrant.yaml
  - api.yaml
  - orchestrator.yaml
  - frontend.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: swarmdev
  app.kubernetes.io/managed-by: kustomize
