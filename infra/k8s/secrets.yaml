apiVersion: v1
kind: Secret
metadata:
  name: swarmdev-secrets
  namespace: swarmdev
type: Opaque
stringData:
  # Replace these with actual secrets or use external secret management
  OLLAMA_BASE_URL: "http://ollama-service:11434"
  OLLAMA_API_KEY: "your-ollama-api-key"
  OLLAMA_MODEL: "codellama"
  E2B_API_KEY: "your-e2b-api-key"
  API_SECRET: "your-api-secret"
  POSTGRES_USER: "swarmdev"
  POSTGRES_PASSWORD: "change-me-in-production"
  DATABASE_URL: "postgresql://swarmdev:change-me-in-production@postgres-service:5432/swarmdev"
  REDIS_URL: "redis://redis-service:6379"
  QDRANT_API_KEY: "your-qdrant-api-key"
