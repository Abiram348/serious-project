name: Deploy SwarmDev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "920373016840"
  ECR_REGISTRY: 920373016840.dkr.ecr.us-east-1.amazonaws.com

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'staging' || github.event.inputs.environment == null))
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::920373016840:role/swarmdev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name swarmdev-staging

      - name: Deploy to EKS (Staging)
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          cd infra/k8s/overlays/staging
          kustomize edit set image swarmdev-web=${{ env.ECR_REGISTRY }}/swarmdev/web:${{ env.IMAGE_SHA }}
          kustomize edit set image swarmdev-api=${{ env.ECR_REGISTRY }}/swarmdev/api:${{ env.IMAGE_SHA }}
          kustomize edit set image swarmdev-orchestrator=${{ env.ECR_REGISTRY }}/swarmdev/orchestrator:${{ env.IMAGE_SHA }}
          kubectl apply -k .

      - name: Wait for rollout (Staging)
        run: |
          kubectl rollout status deployment/staging-web -n swarmdev-staging --timeout=300s
          kubectl rollout status deployment/staging-api -n swarmdev-staging --timeout=300s
          kubectl rollout status deployment/staging-orchestrator -n swarmdev-staging --timeout=300s

      - name: Run DB migrations (Staging)
        run: |
          kubectl create job --from=cronjob/staging-api-migrate staging-api-migrate-${{ github.run_id }} -n swarmdev-staging || true
          kubectl wait --for=condition=complete job/staging-api-migrate-${{ github.run_id }} -n swarmdev-staging --timeout=300s || true

      - name: Notify success
        if: success()
        run: |
          echo "Staging deployment succeeded for commit ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "Staging deployment failed for commit ${{ github.event.workflow_run.head_sha || github.sha }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::920373016840:role/swarmdev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name swarmdev-production

      - name: Deploy to EKS (Production)
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          cd infra/k8s/overlays/production
          kustomize edit set image swarmdev-web=${{ env.ECR_REGISTRY }}/swarmdev/web:${{ env.IMAGE_SHA }}
          kustomize edit set image swarmdev-api=${{ env.ECR_REGISTRY }}/swarmdev/api:${{ env.IMAGE_SHA }}
          kustomize edit set image swarmdev-orchestrator=${{ env.ECR_REGISTRY }}/swarmdev/orchestrator:${{ env.IMAGE_SHA }}
          kubectl apply -k .

      - name: Wait for rollout (Production)
        run: |
          kubectl rollout status deployment/prod-web -n swarmdev-prod --timeout=600s
          kubectl rollout status deployment/prod-api -n swarmdev-prod --timeout=600s
          kubectl rollout status deployment/prod-orchestrator -n swarmdev-prod --timeout=600s

      - name: Run DB migrations (Production)
        run: |
          kubectl create job --from=cronjob/prod-api-migrate prod-api-migrate-${{ github.run_id }} -n swarmdev-prod || true
          kubectl wait --for=condition=complete job/prod-api-migrate-${{ github.run_id }} -n swarmdev-prod --timeout=300s || true

      - name: Notify success
        if: success()
        run: |
          echo "Production deployment succeeded for commit ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "Production deployment failed for commit ${{ github.event.workflow_run.head_sha || github.sha }}"
