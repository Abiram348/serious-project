name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "920373016840"
  ECR_REGISTRY: 920373016840.dkr.ecr.us-east-1.amazonaws.com

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestratorpw
          POSTGRES_DB: swarmdev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orchestrator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node setup for web & api
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      # Install dependencies for web
      - name: Install web dependencies
        working-directory: ./apps/web
        run: pnpm install --frozen-lockfile

      # Lint & test web
      - name: Lint web
        working-directory: ./apps/web
        run: pnpm lint || true

      - name: Test web
        working-directory: ./apps/web
        run: pnpm test || true

      # Install dependencies for api
      - name: Install API dependencies
        working-directory: ./apps/api
        run: pnpm install --frozen-lockfile

      - name: Lint API
        working-directory: ./apps/api
        run: pnpm lint || true

      - name: Test API
        working-directory: ./apps/api
        run: pnpm test || true

      # Python setup for orchestrator
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install orchestrator dependencies
        working-directory: ./apps/orchestrator
        run: pip install -r requirements.txt

      - name: Run orchestrator tests
        working-directory: ./apps/orchestrator
        run: pytest -q

      # Security scans
      - name: Security scans
        run: |
          echo "Running npm audit..."
          pnpm audit --audit-level=high || true
          echo "Running bandit..."
          bandit -r ./apps/orchestrator || true
          echo "Running semgrep..."
          semgrep --config p/default . || true

      # Build Docker images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: swarmdev-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: swarmdev-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build orchestrator image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/orchestrator
          file: ./apps/orchestrator/Dockerfile
          push: false
          tags: swarmdev-orchestrator:ci
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator

      # Trivy container scan
      - name: Scan web image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: swarmdev-web:ci
          format: sarif
          output: trivy-web.sarif

      - name: Scan api image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: swarmdev-api:ci
          format: sarif
          output: trivy-api.sarif

      - name: Scan orchestrator image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: swarmdev-orchestrator:ci
          format: sarif
          output: trivy-orchestrator.sarif

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-web.sarif

  push-to-ecr:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::920373016840:role/swarmdev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/swarmdev/web:${{ github.sha }},${{ env.ECR_REGISTRY }}/swarmdev/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/swarmdev/api:${{ github.sha }},${{ env.ECR_REGISTRY }}/swarmdev/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/orchestrator
          file: ./apps/orchestrator/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/swarmdev/orchestrator:${{ github.sha }},${{ env.ECR_REGISTRY }}/swarmdev/orchestrator:latest
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator
