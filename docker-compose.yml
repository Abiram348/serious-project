

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./apps/web/.env
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3001
      - NEXT_PUBLIC_SOCKET_URL=http://api:3001
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_API_SECRET=${NEXT_PUBLIC_API_SECRET}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      api:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    networks:
      - swarmdev-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./apps/api/.env
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://swarmdev:swarmdevpw@postgres:5432/swarmdev
      - REDIS_URL=redis://redis:6379
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_REASONING_MODEL=${OLLAMA_REASONING_MODEL:-llama4}
      - OLLAMA_CODEGEN_MODEL=${OLLAMA_CODEGEN_MODEL:-codellama}
      - OLLAMA_TEMPLATE_MODEL=${OLLAMA_TEMPLATE_MODEL:-mistral-small}
      - E2B_API_KEY=${E2B_API_KEY}
      - CLOUDFLARE_R2_ACCESS_KEY=${CLOUDFLARE_R2_ACCESS_KEY}
      - CLOUDFLARE_R2_SECRET_KEY=${CLOUDFLARE_R2_SECRET_KEY}
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - ORCHESTRATOR_SECRET=${ORCHESTRATOR_SECRET}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - swarmdev-network

  orchestrator:
    build:
      context: ./apps/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./apps/orchestrator/.env
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://swarmdev:swarmdevpw@postgres:5432/swarmdev
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_REASONING_MODEL=${OLLAMA_REASONING_MODEL:-llama4}
      - OLLAMA_CODEGEN_MODEL=${OLLAMA_CODEGEN_MODEL:-codellama}
      - OLLAMA_TEMPLATE_MODEL=${OLLAMA_TEMPLATE_MODEL:-mistral-small}
      - E2B_API_KEY=${E2B_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - API_SECRET=${ORCHESTRATOR_SECRET}
      - SOCKET_URL=http://api:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - swarmdev-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swarmdev
      POSTGRES_PASSWORD: swarmdevpw
      POSTGRES_DB: swarmdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmdev -d swarmdev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swarmdev-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swarmdev-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swarmdev-network

volumes:
  pgdata:
  qdrant_storage:

networks:
  swarmdev-network:
    driver: bridge
